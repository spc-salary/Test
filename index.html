<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Minimalist Pomodoro</title>
    <style>
        :root {
            --bg: #e0e5ec;
            --accent: #6d5dfc;
            --shadow: #a3b1c6;
            --light: #ffffff;
        }

        body {
            background-color: var(--bg);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            transition: background 1s ease;
        }

        .container {
            width: 350px;
            padding: 30px;
            border-radius: 30px;
            background: var(--bg);
            box-shadow: 20px 20px 60px var(--shadow), -20px -20px 60px var(--light);
            text-align: center;
        }

        #timer-display {
            font-size: 4rem;
            font-weight: 800;
            color: #444;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            margin: 20px 0;
        }

        #controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        button {
            border: none;
            outline: none;
            padding: 15px;
            border-radius: 15px;
            background: var(--bg);
            box-shadow: 6px 6px 12px var(--shadow), -6px -6px 12px var(--light);
            cursor: pointer;
            font-weight: 600;
            color: #666;
            transition: all 0.2s ease;
        }

        button:active {
            box-shadow: inset 4px 4px 8px var(--shadow), inset -4px -4px 8px var(--light);
            color: var(--accent);
        }

        button:focus-visible, .task-input:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .task-input {
            width: 80%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: var(--bg);
            box-shadow: inset 4px 4px 8px var(--shadow), inset -4px -4px 8px var(--light);
            outline: none;
            margin-bottom: 20px;
        }

        #task-list {
            list-style: none;
            padding: 0;
            text-align: left;
            max-height: 150px;
            overflow-y: auto;
        }

        .task-item {
            padding: 10px;
            margin: 5px 0;
            border-radius: 8px;
            background: var(--bg);
            box-shadow: 3px 3px 6px var(--shadow);
            font-size: 0.9rem;
            color: #555;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .delete-btn {
            background: none;
            border: none;
            box-shadow: none;
            padding: 2px 6px;
            margin: 0;
            border-radius: 4px;
            cursor: pointer;
            color: #999;
            font-size: 1.2rem;
            line-height: 1;
            transition: color 0.2s, background-color 0.2s;
        }

        .delete-btn:hover {
            color: #e06c75;
            background-color: rgba(0,0,0,0.05);
        }

        .delete-btn:active {
            box-shadow: none;
            color: #ff0000;
        }

        .delete-btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .working { --bg: #f0e4e4; }
    </style>
</head>
<body>

    <div class="container" id="app">
        <div style="font-size: 0.8rem; letter-spacing: .2px; color: #888;">FOCUS FLOW</div>
        <div id="sr-announcer" class="sr-only" aria-live="polite"></div>
        <div id="timer-display">25:00</div>
        <div id="controls">
            <button id="start">Start</button>
            <button id="reset">Reset</button>
        </div>
        <input type="text" id="task-input" class="task-input" placeholder="What are we doing?" aria-label="New task name">
        <ul id="task-list"></ul>
    </div>

    <script>
        const ORIGINAL_TITLE = 'Minimalist Pomodoro';
        let timeLeft = 25 * 60;
        let timerId = null;
        const display = document.getElementById('timer-display');
        const startBtn = document.getElementById('start');
        const taskInput = document.getElementById('task-input');
        const taskList = document.getElementById('task-list');
        const announcer = document.getElementById('sr-announcer');

        function announce(message) {
            announcer.textContent = '';
            // Force dynamic live-region announcement
            setTimeout(() => {
                announcer.textContent = message;
            }, 100);
        }

        function getFormattedTime() {
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function updateDisplay() {
            const timeStr = getFormattedTime();
            display.textContent = timeStr;
            if (timerId) {
                document.title = `(${timeStr}) ${ORIGINAL_TITLE}`;
            } else {
                document.title = ORIGINAL_TITLE;
            }
        }

        startBtn.addEventListener('click', () => {
            if (timerId) {
                clearInterval(timerId);
                timerId = null;
                startBtn.textContent = 'Start';
                document.body.classList.remove('working');
                updateDisplay();
                announce('Timer paused.');
            } else {
                startBtn.textContent = 'Pause';
                document.body.classList.add('working');
                updateDisplay();
                announce('Timer started. Focus session active.');
                timerId = setInterval(() => {
                    timeLeft--;
                    updateDisplay();
                    if (timeLeft <= 0) {
                        clearInterval(timerId);
                        timerId = null;
                        startBtn.textContent = 'Start';
                        document.body.classList.remove('working');
                        updateDisplay();
                        announce('Focus session complete!');
                        alert('Focus session complete!');
                    }
                }, 1000);
            }
        });

        document.getElementById('reset').addEventListener('click', () => {
            clearInterval(timerId);
            timerId = null;
            timeLeft = 25 * 60;
            startBtn.textContent = 'Start';
            document.body.classList.remove('working');
            updateDisplay();
            announce('Timer reset to twenty-five minutes.');
        });

        taskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && taskInput.value.trim() !== "") {
                const taskText = taskInput.value.trim();
                const li = document.createElement('li');
                li.className = 'task-item';

                const span = document.createElement('span');
                span.textContent = taskText;

                const delBtn = document.createElement('button');
                delBtn.className = 'delete-btn';
                delBtn.setAttribute('aria-label', `Delete task: ${taskText}`);
                delBtn.innerHTML = '&times;';
                delBtn.addEventListener('click', () => {
                    li.remove();
                    announce(`Deleted task: ${taskText}`);
                });

                li.appendChild(span);
                li.appendChild(delBtn);
                taskList.appendChild(li);
                taskInput.value = "";
                announce(`Added task: ${taskText}`);
            }
        });

        // Add keyboard Spacebar shortcut support for Play/Pause
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && document.activeElement !== taskInput) {
                e.preventDefault(); // Prevent scrolling
                startBtn.click();
            }
        });
    </script>
</body>
</html>
